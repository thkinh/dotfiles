source = /home/thkinh/.cache/wal/colors-hyprland.conf

# BACKGROUND
background {
    monitor =
    path = /home/thkinh/Pictures/_Collections/Wallpapers/14.png
    #color = $background
    blur_passes = 0.4
    blur_size = 7
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# Profile Picture
image {
    monitor =
    path = ~/Pictures/_Collections/Zutomayo/BlackNeko.png
    size = 120
    rounding = 30
    border_size = 3
    border_color = $color4
    position = 4, -45
    halign = left
    valign = top
}

#Profile name
label {
    monitor =
    text = cmd[update:1000] echo "$(whoami)"
    color = $color7
    font_size = 20
    font_family = RadioCanada Big
    position = 26, -173
    halign = left
    valign = top
}

# INPUT FIELD
input-field {
  monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $foreground
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $color5 
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# TIME
label {
  monitor = 
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 1)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# BATTERY
label {
  monitor =
    text = cmd[update:1000] echo "$(/home/$USER/.config/hypr/scripts/check_battery.sh)"
    color = $color10
    font_size = 20
    font_family = JetBrains Mono Extrabold
    position = 10, 0
    halign = left
    valign = top
}
