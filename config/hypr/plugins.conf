# .config/hypr/hyprland.conf
exec-once = hyprpm enable hyprexpo
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(999999)
        workspace_method = center current # [center/first] [workspace]
        skip_empty = true 
        gesture_distance = 100 # how far is the "max" for the gesture
    }
}
